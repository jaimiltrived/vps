name: 24/7 VPS Cloud Auto-Rotate

on:
  schedule:
    # Runs every 12 hours automatically in the cloud
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --quiet kaggle requests

      - name: Run Cloud Rotation & Update Tunnel Link
        run: |
          python rotate.py

      - name: Commit and Push Updated Redirect Link
        run: |
          git config --global user.name "VPS-Cloud-Bot"
          git config --global user.email "bot@ourvps.cloud"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update VPS live tunnel URL [skip ci]"
          git push
